name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  apm-sync:
    name: APM sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: extractions/setup-just@v2
      - run: just apm-sync

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: extractions/setup-just@v2
      - run: just test

  lint:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: extractions/setup-just@v2
      - run: just lint